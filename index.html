<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Budget Home</title>
<meta name="theme-color" content="#0B3C2D">
<meta name="description" content="Budget di famiglia: spese, entrate, piano di rientro.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icona.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget Home">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>html,body{margin:0;padding:0}</style>
</head>
<body>
<style>
:root{
  --bg:#F2F6F3; --paper:#FFFFFF; --paper2:#E8EFEA; --line:#E1EAE3; --ink:#0F2018; --ink2:#52675C; --mute:#7C8F86;
  --acc:#0B3C2D; --acc-soft:#DDF3E8; --acc-ink:#0B3C2D; --em:#10B981; --teal:#137E66; --in:#137E66; --in-soft:#DCEFEA;
  --good:#0E9F6E; --good-soft:#DCF5EA; --warn:#B7791F; --warn-soft:#FBEFD9; --bad:#DC2626; --bad-soft:#FDE4E4;
  --shadow:0 4px 20px -2px rgba(11,60,45,.06),0 2px 6px -1px rgba(0,0,0,.03);
  --r:22px; --r2:16px; --disp:'Noto Serif',Georgia,serif; --body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cfo1:#0B3C2D; --cfo2:#072B20; --cfo3:#0A1F18;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#0B1210; --paper:#121E1A; --paper2:#182823; --line:#20342E; --ink:#ECF4EF; --ink2:#8CA298; --mute:#6F857B;
  --acc:#34D399; --acc-soft:#123B2E; --acc-ink:#A7F3D0; --em:#10B981; --teal:#2DD4BF; --in:#5EEAD4; --in-soft:#10302C;
  --good:#34D399; --good-soft:#0F3527; --warn:#FBBF24; --warn-soft:#3B2E0F; --bad:#F87171; --bad-soft:#3F1D1D;
  --shadow:0 8px 30px -4px rgba(0,0,0,.4),0 2px 8px -2px rgba(0,0,0,.3); --cfo1:#0F2A22; --cfo2:#0B1F19; --cfo3:#08160F;}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#0B1210; --paper:#121E1A; --paper2:#182823; --line:#20342E; --ink:#ECF4EF; --ink2:#8CA298; --mute:#6F857B;
  --acc:#34D399; --acc-soft:#123B2E; --acc-ink:#A7F3D0; --em:#10B981; --teal:#2DD4BF; --in:#5EEAD4; --in-soft:#10302C;
  --good:#34D399; --good-soft:#0F3527; --warn:#FBBF24; --warn-soft:#3B2E0F; --bad:#F87171; --bad-soft:#3F1D1D;
  --shadow:0 8px 30px -4px rgba(0,0,0,.4),0 2px 8px -2px rgba(0,0,0,.3); --cfo1:#0F2A22; --cfo2:#0B1F19; --cfo3:#08160F;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.45 var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
.frame{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative}
@media(min-width:560px){.frame{margin:20px auto;min-height:calc(100% - 40px);border:1px solid var(--line);border-radius:32px;overflow:hidden;box-shadow:var(--shadow)}}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:12px 18px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.period{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--paper);border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.period .eyebrow{margin:0}.period i{width:6px;height:6px;border-radius:50%;background:var(--em);display:inline-block;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.eyebrow{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:800;white-space:nowrap}
h1{font:700 23px/1.05 var(--disp);margin:0;letter-spacing:-.01em;color:var(--acc)}
.hsub{font-size:12px;color:var(--ink2);font-weight:500;margin-top:2px}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--paper);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.profile{display:flex;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:inset 0 1px 2px rgba(0,0,0,.04)}
.profile button{border:0;background:transparent;color:var(--ink2);font:600 12px var(--body);padding:6px 11px;border-radius:999px;cursor:pointer}
.profile button.on{background:var(--acc);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.1)}
:root[data-theme="dark"] .profile button.on{color:#0B1210}
.hbtn{border:1px solid var(--line);background:var(--paper);color:var(--ink2);font:600 11.5px var(--body);padding:6px 10px;border-radius:999px;cursor:pointer}
main{flex:1;padding:16px 18px 104px;display:flex;flex-direction:column;gap:14px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;justify-content:center;pointer-events:none}
nav.tabs .bar{pointer-events:auto;width:100%;max-width:480px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.06)}
@media(min-width:560px){nav.tabs .bar{border-radius:0 0 32px 32px;border:1px solid var(--line)}}
nav.tabs button{border:0;background:transparent;color:var(--mute);font:600 10.5px var(--body);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;border-radius:10px;cursor:pointer}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
nav.tabs button.on{color:var(--acc);font-weight:800}nav.tabs button.on svg{transform:scale(1.08)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.card.soft{background:var(--paper2);box-shadow:none}
.card h2{font:700 16px/1.25 var(--body);margin:0 0 10px;letter-spacing:-.01em}
.card h3{font:800 11px var(--body);margin:14px 0 6px;color:var(--ink2);text-transform:uppercase;letter-spacing:.08em}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--paper2);border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px}
.kpi .l{font-size:11.5px;color:var(--ink2);font-weight:600}
.kpi .v{font:800 22px/1.1 var(--disp);margin:4px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:11.5px;color:var(--ink2)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{font-weight:700;font-size:14px}
.row .m{font-size:12px;color:var(--ink2)}
.row .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;font-family:var(--disp)}
.pos{color:var(--teal)}
.eyebrow-sec{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:4px 4px 0}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--paper2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.in{background:var(--in-soft);color:var(--in);border-color:transparent}
.pill.acc{background:var(--acc-soft);color:var(--acc-ink);border-color:transparent}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r2);background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.alert.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.alert.good{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.alert .t{font-weight:800;font-size:13.5px}.alert .d{font-size:12.5px;color:var(--ink2)}.alert a{color:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink2);font:700 12px var(--body);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
:root[data-theme="dark"] .chip.on{color:#0B1210}
.search{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:11px 14px;font:14px var(--body);color:var(--ink)}
.prog{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--em);border-radius:999px}
.prog.warn i{background:var(--warn)}.prog.bad i{background:var(--bad)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;color:var(--mute);font-weight:800;padding:4px 0}
.cal .d{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;font-size:13px;font-variant-numeric:tabular-nums;cursor:pointer;border:1px solid transparent;gap:2px}
.cal .d.x{opacity:.25}
.cal .d:hover{background:var(--paper2)} .cal .d.sel{background:var(--acc);color:#fff}
.cal .dots{display:flex;gap:2px;height:5px}.cal .dots i{width:5px;height:5px;border-radius:50%;background:var(--bad)}.cal .dots i.in{background:var(--in)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.tile b{font-size:14px}.tile span{font-size:12px;color:var(--mute)}
.tile svg{width:22px;height:22px;stroke:var(--em);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{border:0;background:var(--em);color:#fff;font:700 14px var(--body);padding:12px 16px;border-radius:14px;cursor:pointer;width:100%;box-shadow:0 6px 16px -6px rgba(16,185,129,.5)}
.btn.ghost{background:var(--paper);color:var(--acc);border:1px solid var(--line);box-shadow:none}
.btn.sm{width:auto;padding:7px 12px;font-size:12.5px;border-radius:10px}
.btn.ghost.sm{width:auto}
.fab{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom,0px));right:calc(50% - 225px);width:56px;height:56px;border-radius:50%;background:var(--em);color:#fff;border:0;font-size:30px;line-height:1;box-shadow:0 10px 24px -6px rgba(16,185,129,.6);cursor:pointer;z-index:6}
@media(max-width:559px){.fab{right:18px}}
.sheet-bg{position:fixed;inset:0;background:rgba(5,15,12,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheet{width:100%;max-width:480px;background:var(--paper);border-radius:26px 26px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.sheet h2{font:700 19px var(--disp);margin:0 0 12px}
label.f{display:block;font-size:12px;font-weight:800;color:var(--ink2);margin:12px 0 4px}
.sheet input,.sheet select,.inp{width:100%;border:1px solid var(--line);background:var(--paper2);border-radius:12px;padding:10px 12px;font:14px var(--body);color:var(--ink)}
.inp.n{width:110px;text-align:right}
select.inp.s{width:auto;padding:5px 8px;font-size:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;border:1px solid var(--line);background:var(--paper2);border-radius:12px;padding:9px;font:700 13px var(--body);color:var(--ink2);cursor:pointer;min-width:70px}.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
:root[data-theme="dark"] .seg button.on{color:#0B1210}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}
.tw{overflow-x:auto}
tr.on td{background:var(--acc-soft)}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--teal);font:700 13px var(--body);padding:0;cursor:pointer}
.note{font-size:12.5px;color:var(--ink2);line-height:1.5}
.hint{font-size:11.5px;color:var(--mute)}
.big{font:800 32px/1 var(--disp);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
input[type=range]{width:100%;accent-color:var(--em)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--acc);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:30;box-shadow:var(--shadow)}
.ol{margin:0;padding-left:18px;font-size:13.5px;line-height:1.5}.ol li{margin:4px 0}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font:10.5px var(--body);fill:var(--mute)}
.leg{display:flex;gap:12px;font-size:11.5px;color:var(--ink2);margin-top:4px;flex-wrap:wrap}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--em);outline-offset:2px}
@media(prefers-reduced-motion:no-preference){.prog i{transition:width .4s ease}}
/* legacy scala (piano pages) */
.scala{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.sc-now{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.sc-now .l{font-size:12px;color:var(--ink2);font-weight:600}.sc-now .v{font-family:var(--disp);font-size:30px;font-weight:800;line-height:1.1}.sc-now small{font-size:13px;color:var(--ink2);font-family:inherit;margin-left:2px}.sc-now .m{font-size:12px;color:var(--ink2);text-align:right;max-width:55%}
.sc-step{padding:10px 8px;border-radius:12px;margin:4px -8px;cursor:pointer}.sc-step.on{background:var(--paper2);outline:1px solid var(--line)}
.sc-h{display:flex;gap:10px;align-items:flex-start}.sc-n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:12px;font-weight:700;display:grid;place-items:center}
.sc-t{flex:1;display:flex;flex-direction:column}.sc-t b{font-size:14px}.sc-t span{font-size:12px;color:var(--ink2)}.sc-v{font-weight:700;font-size:16px;white-space:nowrap}
.sc-bar,.pbar{position:relative;height:8px;border-radius:99px;background:var(--line);margin:8px 0 6px}.sc-bar i,.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}.pbar i{background:var(--em)}
.sc-bar em,.pbar em{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;background:var(--ink);border-radius:2px}
.sc-sl{margin-top:6px}.pp{padding:10px 0;border-top:1px solid var(--line)}.sel-row{cursor:pointer}.sel-row.on .t{color:var(--teal)}
.mvrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}select.mv{font-size:12px;padding:3px 6px;height:auto;width:auto;max-width:150px}
.login-bar{padding:10px 12px}
.login-bar .lg{display:grid;grid-template-columns:1fr 90px auto;gap:8px;align-items:center}.login-bar .lg .seg{margin:0}.login-bar .lg .inp{margin:0;text-align:center}.login-bar .lg .btn{margin:0;width:auto;padding-left:18px;padding-right:18px}
/* ===== cruscotto ===== */
.hero{background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:20px 22px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--em) 18%,transparent),transparent 70%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.av-row{display:flex;align-items:flex-start;padding:10px 0}
.av-row:last-child{border-bottom:0!important}
.cov-b{position:relative}
.cov-b i.oggi{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45;border-radius:2px}
.fido-box{margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--paper2);border:1px solid var(--line)}
.fido-box.bad{border-color:var(--bad);background:var(--bad-soft)}
.fido-box.warn{border-color:var(--warn);background:var(--warn-soft)}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink2);font:600 11px/1 var(--body);cursor:pointer;vertical-align:middle;padding:0}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hero-v{font:800 38px/1 var(--disp);letter-spacing:-.02em;margin:6px 0 4px;font-variant-numeric:tabular-nums;color:var(--acc)}.hero-v small{font-size:14px;color:var(--ink2);font-family:var(--body);font-weight:600;margin-left:4px;letter-spacing:0}
:root[data-theme="dark"] .hero-v{color:var(--ink)}
.hero-s{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}.hero-s b{color:var(--ink)}
.stat{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:800;border:1px solid transparent}
.stat.good{background:var(--good-soft);color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent)}.stat.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}.stat.bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.gauge{width:78px;height:78px;flex:none}.gauge text{font:800 15px var(--body);fill:var(--ink)}
.sem{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}.sem.good{background:var(--good)}.sem.warn{background:var(--warn)}.sem.bad{background:var(--bad)}
.cov{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.cov-h{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:8px}.cov-h b{color:var(--ink)}
.cov-b{display:flex;gap:3px;height:12px;border-radius:99px;background:var(--paper2);padding:2px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}.cov-b i{display:block;height:100%;border-radius:99px}
.cov-l{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;padding:10px 12px;border-radius:var(--r2);background:var(--paper2);border:1px solid var(--line)}
.cov-l span{display:flex;flex-direction:column;font-size:11px;color:var(--ink2);font-weight:600;min-width:0}.cov-l span b.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:-1px}.cov-l span em{font-style:normal;font-size:13.5px;font-weight:800;color:var(--ink);margin-top:2px;font-variant-numeric:tabular-nums}
.steps-h{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px}.steps-h .eyebrow{color:var(--ink2)}.steps-h span.g{font-size:11.5px;font-weight:700;color:var(--em)}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

function disp(k){const c=CONTI[k]||{saldo:null,fido:0};const carte=CARTE.filter(x=>x.conto===k).reduce((a,x)=>a+x.ciclo,0);
  const fisse=FISSE.filter(f=>(f.conto===k||(k==='mpsR'&&f.conto==='crv'))&&f.cat!=='Carte'&&!f.nobudget&&dueIn(f,NEXT.m)).reduce((a,f)=>a+f.imp,0);
  const reg=regCarte(k);
  const dir2=regDiretto(k);
  const giro=giroNetto(k);
  return {saldo:c.saldo,fido:c.fido,carte,fisse,reg:reg+dir2,giro,spazio:c.saldo==null?null:c.saldo+c.fido,reale:c.saldo==null?null:c.saldo+c.fido-carte-fisse-reg-dir2+giro}}
// conto da cui esce davvero un movimento: addebito scelto (altro) o il conto per nome (bancomat/conto/f24)
function contoKeyDi(x){ if(x.addebito)return x.addebito; return Object.keys(CONTI).find(k=>CONTI[k].n===x.conto)||null; }
// spese registrate con addebito diretto su k (bancomat, bonifico, F24, ricariche altro) non ancora nel saldo
function regDiretto(k){return LEDGER.filter(x=>x.user&&x.tipo==='spesa'&&(x.d||'').slice(0,7)>=MESE&&['bancomat','conto','f24','altro'].includes(x.mezzo)&&contoKeyDi(x)===k).reduce((a,x)=>a+x.imp,0)}
// giroconti registrati (questo mese in poi) non ancora riflessi nel saldo: + se entrano su k, − se escono
function giroNetto(k){return LEDGER.filter(x=>x.tipo==='giroconto'&&(x.gda===k||x.ga===k)&&(x.d||'').slice(0,7)>=MESE).reduce((a,x)=>a+(x.ga===k?x.imp:-x.imp),0)}
// spese registrate con carta che devono ancora essere addebitate sul conto k
function regCarte(k,extra){return LEDGER.filter(x=>x.mezzo==='carta'&&x.tipo==='spesa'&&(x.comp||'')>=MESE&&((CARTE.find(c=>c.n===x.carta)||{}).conto===k)).reduce((a,x)=>a+x.imp,0)+(extra||0)}
// dettaglio di cosa deve ancora uscire da un conto: estratti chiusi + spese registrate
function impegniConto(k){const out=[];
  CARTE.filter(c=>c.conto===k&&c.ciclo).forEach(c=>out.push({v:c.n,imp:c.ciclo,g:c.g,q:'estratto chiuso',mese:nextComp(c)}));
  LEDGER.filter(x=>x.mezzo==='carta'&&x.tipo==='spesa'&&(x.comp||'')>=MESE&&((CARTE.find(c=>c.n===x.carta)||{}).conto===k))
    .forEach(x=>{const c=CARTE.find(c=>c.n===x.carta)||{g:15};out.push({v:(x.voce||'Spesa')+' · '+x.carta,imp:x.imp,g:c.g,q:'registrata il '+fmtD(x.d),mese:x.comp})});
  LEDGER.filter(x=>x.tipo==='giroconto'&&(x.d||'').slice(0,7)>=MESE&&(x.gda===k||x.ga===k)).forEach(x=>{const inn=x.ga===k;
    out.push({v:inn?'Giroconto da '+((CONTI[x.gda]||{}).n||x.gda):'Giroconto a '+((CONTI[x.ga]||{}).n||x.ga),imp:x.imp,g:+x.d.slice(8),q:'giroconto '+fmtD(x.d),mese:x.d.slice(0,7),pos:inn,giro:true})});
  return out.sort((a,b)=>(a.mese+String(a.g).padStart(2,'0')).localeCompare(b.mese+String(b.g).padStart(2,'0')))}
// come andrebbe il conto se ci aggiungo una spesa
function effettoConto(k,imp){const d=disp(k);if(d.saldo==null)return null;
  const dopo=d.reale-(imp||0), usoPrima=d.fido?Math.min(1,Math.max(0,-(d.saldo))/d.fido):0, usoDopo=d.fido?Math.min(1,Math.max(0,-(d.saldo)+ (d.carte+d.fisse+d.reg+(imp||0)))/d.fido):0;
  return {...d,dopo,usoPrima,usoDopo}}

// ---------------- grafici SVG ----------------
function barChart(series,labels,opts={}){ // series: [{v:[],color}], grouped
  const W=400,H=150,P={l:34,r:6,t:8,b:20};const n=labels.length;const max=Math.max(...series.flatMap(s=>s.v))*1.08||1;
  const gw=(W-P.l-P.r)/n, bw=(gw-4)/series.length;
  const y=v=>P.t+(H-P.t-P.b)*(1-v/max);
  const ticks=[0,.5,1].map(t=>Math.round(max*t/100)*100);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.label||''}">`;
  ticks.forEach(t=>{s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l-4}" y="${y(t)+3.5}" text-anchor="end">${t>=1000?(t/1000).toFixed(t%1000?1:0)+'k':t}</text>`});
  labels.forEach((l,i)=>{series.forEach((sr,j)=>{const v=sr.v[i];const x=P.l+i*gw+2+j*bw;s+=`<rect x="${x}" y="${y(v)}" width="${bw-1}" height="${Math.max(0,y(0)-y(v))}" rx="2" fill="${sr.color}"${sr.hi&&sr.hi(i)?' opacity=".55"':''}/>`});
    s+=`<text x="${P.l+i*gw+gw/2}" y="${H-6}" text-anchor="middle">${l}</text>`});
  return s+'</svg>'}
function lineChart(lines,labels,opts={}){const W=400,H=150,P={l:40,r:8,t:8,b:20};const n=labels.length;const all=lines.flatMap(l=>l.v);const max=Math.max(...all)*1.05||1,min=Math.min(0,...all);
  const x=i=>P.l+i*(W-P.l-P.r)/(n-1), y=v=>P.t+(H-P.t-P.b)*(1-(v-min)/(max-min));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;[0,.5,1].forEach(t=>{const v=min+(max-min)*t;s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P.l-4}" y="${y(v)+3.5}" text-anchor="end">${Math.round(v/1000)}k</text>`});
  lines.forEach(l=>{const d=l.v.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');s+=`<path d="${d}" fill="none" stroke="${l.color}" stroke-width="2"${l.dash?' stroke-dasharray="4 4"':''}/>`;const li=l.v.length-1;s+=`<circle cx="${x(li)}" cy="${y(l.v[li])}" r="3.5" fill="${l.color}"/>`});
  labels.forEach((l,i)=>{if(i%Math.ceil(n/8)===0||i===n-1)s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${l}</text>`});
  return s+'</svg>'}

    if(!m&&!una){col='warn';why.push('Inserisci un importo.')}
  }
  return {col,why,az,notice,m,una};
}

// stima del saldo di OGGI su un conto: estratto + calendario già passato nel mese + movimenti registrati
function saldoOggi(k){
  const c=CONTI[k]; if(!c||c.saldo==null)return null;
  const m=+MESE.slice(5); let s=+c.saldo, out=0, inn=0, reg=0;
  FISSE.filter(f=>f.conto===k&&!f.canale&&dueIn(f,m)&&f.g<=GIORNO).forEach(f=>{s-=f.imp;out+=f.imp});
  CARTE.filter(x=>x.conto===k&&x.ciclo&&x.g<=GIORNO).forEach(x=>{s-=x.ciclo;out+=x.ciclo});
  ENTRATE.filter(e=>e.conto===k&&e.g<=GIORNO&&(!e.mesi||e.mesi.includes(m))).forEach(e=>{s+=e.imp;inn+=e.imp});
  LEDGER.filter(x=>x.user&&(x.d||'').slice(0,7)===MESE).forEach(x=>{
    if(x.tipo==='giroconto'){if(x.ga===k){s+=x.imp;reg+=x.imp}if(x.gda===k){s-=x.imp;reg-=x.imp}}
    else if(x.tipo==='versamento'&&k==='mpsC'){s+=x.imp;reg+=x.imp}
    else if(x.tipo==='spesa'&&['bancomat','conto','f24','altro'].includes(x.mezzo)&&contoKeyDi(x)===k){s-=x.imp;reg-=x.imp}
    else if(x.tipo==='entrata'&&contoKeyDi(x)===k){s+=x.imp;reg+=x.imp}
  });
  return {s,base:+c.saldo,upd:c.upd,out,inn,reg,fido:c.fido||0,uso:c.fido?Math.min(1,Math.max(0,-s)/c.fido):0};
}

function allarmeConto(k,giorni){
  const S=saldoOggi(k); if(!S)return null;
  const m=+MESE.slice(5), fine=GIORNO+(giorni||14);
  const eventi=[];
  FISSE.filter(f=>f.conto===k&&!f.canale&&dueIn(f,m)&&f.g>GIORNO&&f.g<=fine).forEach(f=>eventi.push({g:f.g,v:f.v,imp:f.imp}));
  CARTE.filter(x=>x.conto===k&&x.ciclo&&x.g>GIORNO&&x.g<=fine).forEach(x=>eventi.push({g:x.g,v:'Estratto '+x.n,imp:x.ciclo}));
  eventi.sort((a,b)=>a.g-b.g);
  let sal=S.s,min=S.s,minG=GIORNO;
  eventi.forEach(e=>{sal-=e.imp;if(sal<min){min=sal;minG=e.g}});
  const lim=-(S.fido||0), manca=Math.max(0,lim-min), usoMin=S.fido?Math.min(1,Math.max(0,-min)/S.fido):0;
  const entAttese=ENTRATE.filter(e=>e.conto===k&&e.g>GIORNO&&e.g<=fine&&(!e.mesi||e.mesi.includes(m))).reduce((a,e)=>a+e.imp,0);
  return {...S,eventi,min,minG,manca,usoMin,entAttese,cons:manca>0?Math.ceil((manca+50)/10)*10:0,fine};
}

// piano di integrazione del conto: gli addebiti automatici sono dati per scontati,
// qui si calcola solo COSA manca e PER QUANDO. Entrate contate solo se certe (assegno INPS).
function pianoIntegrazione(k,conVersamenti){
  const S=saldoOggi(k); if(!S)return null;
  const m=+MESE.slice(5), ev=[];
  FISSE.filter(f=>f.conto===k&&!f.canale&&dueIn(f,m)&&f.g>GIORNO).forEach(f=>ev.push({g:f.g,imp:-f.imp,v:f.v}));
  CARTE.filter(x=>x.conto===k&&x.ciclo&&x.g>GIORNO).forEach(x=>ev.push({g:x.g,imp:-x.ciclo,v:'estratto '+x.n}));
  ENTRATE.filter(e=>e.conto===k&&e.g>GIORNO&&e.certa&&(!e.mesi||e.mesi.includes(m))).forEach(e=>ev.push({g:e.g,imp:e.imp,v:e.v}));
  if(conVersamenti&&k==='mpsC')VERSAMENTI.filter(v=>v.a==='Comune'&&v.g>GIORNO).forEach(v=>ev.push({g:v.g,imp:v.imp,v:'versamento di '+v.da+' (da piano)'}));
  ev.sort((a,b)=>a.g-b.g);
  const lim=-(S.fido||0); let s=S.s, top=[], tot=0;
  ev.forEach(e=>{s+=e.imp; if(s<lim-.005){const need=lim-s;
    const u=top[top.length-1];
    if(u&&u.g===e.g){u.imp+=need;u.per+=' + '+e.v}else top.push({g:e.g,imp:need,per:e.v});
    s=lim; tot+=need}});
  return {...S,ev,top,tot,fine:s,lim};
}

function proiezione(start,mensileRientro,surplusOggi,goalsM,n=24){

function mediana(a){const s=a.slice().sort((x,y)=>x-y);const n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):0}
function anomalie(scope){

    else st.forEach(s=>{if(s[1]>med*1.8&&s[1]-med>30)out.push({id:f.id,v:f.v,d:s[0],t:'picco',msg:`${eur(s[1])}: quasi il doppio del solito (${eur(med)})`})});
    if(f.f==='mensile'){const months={};st.forEach(s=>{const k=s[0].slice(0,7);months[k]=(months[k]||0)+1});
      MESI12.slice(1).forEach(m=>{if(!months[m])out.push({id:f.id,v:f.v,d:m+'-01',t:'mancante',msg:`nessun addebito a ${monthNames[+m.slice(5)-1]} ${m.slice(2,4)}`})});

  });

async function pullAll(){
  if(!sb)return;
  const nomi=Object.keys(TAB);
  const res=await Promise.all(nomi.map(t=>sb.from(t).select('*')));
  nomi.forEach((t,i)=>{const {data,error}=res[i]; if(error||!data)return;
    if(t==='conti'){Object.keys(CONTI).forEach(k=>delete CONTI[k]);data.forEach(r=>{CONTI[r.k]=TAB.conti.from(r)});
      Object.entries(BASE.conti).forEach(([k,v])=>{if(!CONTI[k])CONTI[k]={n:v.n,ch:v.ch,saldo:null,fido:0,nascosto:true,note:'non visibile da questo profilo'}});return}
    const a=ARR[t]();a.length=0;data.forEach(r=>a.push(TAB[t].from(r)));
    if(t==='registro')a.sort((x,y)=>y.d.localeCompare(x.d));
  });
  const {data:imp}=await sb.from('impostazioni').select('*');
  (imp||[]).forEach(r=>{const v=r.v||{};
    if(r.k==='REGOLA')Object.assign(REGOLA,v); if(r.k==='PIANO')Object.assign(PIANO,v);
    if(r.k==='SOGLIE')Object.assign(SOGLIE,v); if(r.k==='INCOME')Object.assign(INCOME,v);
    if(r.k==='OPEN')Object.assign(OPEN,v); if(r.k==='TODO')Object.assign(TODO,v);});
  const {data:cs}=await sb.from('casse').select('*');
  (cs||[]).forEach(r=>{CASSE[r.k]=num(r.saldo)||0});
  if(!FISSE.length){ ripristinaBase(); setSync('errore'); return }
  OBIETTIVI.forEach(o=>o.centro=o.owner);
  setSync('live');
}

let pushT=null, pushing=false;
function syncPush(){ if(!sb||!ME)return; setSync('sync'); clearTimeout(pushT); pushT=setTimeout(doPush,1200) }
async function doPush(){
  if(!sb||!ME||pushing)return; pushing=true;
  try{
    const job=[];
    job.push(sb.from('conti').upsert(Object.entries(CONTI).filter(([k,c])=>MIEICHI().includes(c.ch)).map(([k,c])=>TAB.conti.to(c,k))));
    for(const t of ['fisse','variabili','entrate','obiettivi','debiti','carte','patrimonio']){
      const rows=soloMiei(t,ARR[t]()).map(TAB[t].to); if(rows.length)job.push(sb.from(t).upsert(rows));
    }
    const vs=VERSAMENTI.filter(v=>v._id).map(TAB.versamenti.to); if(vs.length)job.push(sb.from('versamenti').upsert(vs));
    if(VERSCOM.length)job.push(sb.from('versamenti_comune').upsert(VERSCOM.map(TAB.versamenti_comune.to)));
    const rg=LEDGER.filter(x=>x._id).map(TAB.registro.to); if(rg.length)job.push(sb.from('registro').upsert(rg));
    job.push(sb.from('casse').upsert(Object.entries(CASSE).map(([k,s])=>({k,saldo:num(s)||0}))));
    job.push(sb.from('impostazioni').upsert([
      {k:'REGOLA',v:REGOLA,scope:'famiglia'},{k:'PIANO',v:PIANO,scope:'famiglia'},
      {k:'SOGLIE',v:SOGLIE,scope:'famiglia'},{k:'INCOME',v:INCOME,scope:'famiglia'},
      {k:'OPEN',v:OPEN,scope:ME.id},{k:'TODO',v:TODO,scope:ME.id}]));
    await Promise.all(job); setSync('live');
  }catch(e){ setSync('errore') } finally{ pushing=false }
}

    const mio=x.per===me, famMia=x.fam&&x.chi===nome;
    if(!mio&&!famMia)return;
    fatte.push({v:x.voce,imp:x.imp,g:+x.d.slice(8),t:x.tipo!=='spesa'?x.tipo:(mio?'spesa':'fam-spesa'),conto:x.conto,comp:x.comp}) });
  VERSAMENTI.filter(v=>v.da===nome&&v.a==='Comune').forEach(v=>{
    (v.g<=g?fatte:restano).push({v:'Versamento sul conto comune',imp:v.imp,g:v.g,t:'versamento'}) });
  const serve=P.L[P.liv-1], fatto=fatte.reduce((a,x)=>a+x.imp,0);
  const usato=LEDGER.filter(x=>x.d.startsWith(ym)&&x.tipo==='spesa'&&x.per===me).reduce((a,x)=>a+x.imp,0);
  return {P,serve,fatto,resta:Math.max(0,serve-fatto),p:serve?Math.min(1,fatto/serve):0,
          g,gg:GG_MESE,pTempo:GG_MESE?g/GG_MESE:0,budg:P.vr,usato,
          fatte:fatte.sort((a,b)=>a.g-b.g),restano:restano.sort((a,b)=>a.g-b.g)};
}

function proiezioniFranci(){
  const inc=SSI.reduce((a,x)=>a+x.inc,0), t=taxOn(inc);
  const tratt=inc-SSI.reduce((a,x)=>a+x.giro,0);
  const manca=Math.max(0,t.tot-tratt);
  const medio=SSI.length?inc/SSI.length:0, perBonifico=taxOn(medio).tot;
  const restaAnno=12-SSI.length;
  const annoPieno=medio*12, tAnno=taxOn(annoPieno);
  const cf=FISSE.find(f=>f.id==='cfin'), rata=cf?cf.imp:0;
  const st=(typeof STAG!=='undefined'&&STAG.franci)?STAG.franci:[];
  const mesi=(typeof STAG!=='undefined'&&STAG.months)?STAG.months:[];
  const medioMese=st.length?st.reduce((a,b)=>a+b,0)/st.length:0;
  const vuoti=st.map((v,i)=>({v,m:mesi[i]})).filter(x=>x.v<medioMese*.5);
  const pieni=st.map((v,i)=>({v,m:mesi[i]})).filter(x=>x.v>medioMese*1.3);
  const buco=vuoti.reduce((a,x)=>a+(medioMese-x.v),0);
  // fondo tasse nei prossimi 12 mesi: col 29 % trattenuto, e senza
  const conRegola=[], senza=[];
  let a=tratt, b=tratt;
  for(let m=1;m<=12;m++){ a+=perBonifico; b+=tratt/Math.max(1,SSI.length); conRegola.push(Math.round(a)); senza.push(Math.round(b)) }
  const etich=Array.from({length:12},(_,i)=>monthNames[(+MESE.slice(5)-1+i)%12]);
  return sec('proiez','Proiezioni · fondo tasse e stagionalità','dove vanno a finire i tuoi numeri', `
  <h3>Il fondo tasse, da dove esce ${eur(t.tot)}</h3>
  <div class="row"><div><div class="t">Incassato da SSI nel 2026</div><div class="m">${SSI.length} bonifici, da ${monthNames[1]} a ${monthNames[8]}</div></div><div class="a">${eur(inc)}</div></div>
  <div class="row"><div><div class="t">Reddito imponibile</div><div class="m">× 78 % (coefficiente consulenza)</div></div><div class="a">${eur(t.imp)}</div></div>
  <div class="row"><div><div class="t">INPS Gestione Separata</div><div class="m">26,07 % dell'imponibile</div></div><div class="a">${eur(t.inps)}</div></div>
  <div class="row"><div><div class="t">Imposta sostitutiva</div><div class="m">15 % su imponibile meno INPS</div></div><div class="a">${eur(t.tax)}</div></div>
  <div class="row"><div><div class="t"><b>Totale da mettere da parte</b></div><div class="m">= ${pct(t.rate)} di ogni bonifico</div></div><div class="a"><b>${eur(t.tot)}</b></div></div>
  <div class="row"><div><div class="t">Trattenuto finora</div><div class="m">${pct(inc?tratt/inc:0)} invece del ${pct(t.rate)}</div></div><div class="a" style="color:var(--bad)">${eur(tratt)}</div></div>
  <div class="note warn" style="margin:8px 0">Mancano <b>${eur(manca)}</b>. E attenzione: questo è il conto sui <b>soli ${SSI.length} mesi già incassati</b>. Se gli ultimi ${restaAnno} mesi vanno come la media (${eur(medio)} a bonifico), l'anno pieno fa ${eur(annoPieno)} e il dovuto sale a <b>${eur(tAnno.tot)}</b>.</div>
  <div class="note" style="margin-bottom:10px">Due cose da sapere: l'INPS al 26,07 % vale se non hai altra copertura previdenziale, altrimenti scende a ~24 % e il totale a ~27 %. E questo è l'<b>accantonamento</b>, non la dichiarazione: gli F24 veri li calcola Laura sull'anno intero con saldo e acconti.</div>
  <h3>Il fondo nei prossimi 12 mesi</h3>
  ${lineChart([{v:senza,color:'var(--bad)',dash:true},{v:conRegola,color:'var(--em)'}],etich)}
  <div class="leg"><span><i style="background:var(--em)"></i>trattenendo il ${pct(t.rate)}</span><span><i style="background:var(--bad)"></i>come stai facendo ora</span></div>
  <div class="hint" style="margin-top:6px">Su ogni bonifico da ${eur(medio)} vanno lasciati <b>${eur(perBonifico)}</b> sul conto, e girati a Roby ${eur(medio-perBonifico)}.</div>
  <h3>I tuoi mesi non sono uguali</h3>
  <div class="note" style="margin-bottom:8px">Entrate tue (senza SSI): media ${eur(medioMese)} al mese, ma ${pieni.length?pieni.map(x=>monthNames[+x.m.slice(5)-1]+' '+eur(x.v)).join(', '):'—'} sono i mesi pieni e ${vuoti.length?vuoti.map(x=>monthNames[+x.m.slice(5)-1]).join(', '):'—'} quelli quasi a zero.</div>
  <div class="row"><div><div class="t">Quanto manca nei mesi vuoti</div><div class="m">rispetto alla tua media</div></div><div class="a">${eur(buco)}</div></div>
  <div class="row"><div><div class="t">Da mettere via nei mesi pieni</div><div class="m">${pieni.length} mesi buoni · ${eur(pieni.length?buco/pieni.length:0)} ciascuno</div></div><div class="a">${eur(buco)}</div></div>
  <div class="hint" style="margin-top:6px">Ottobre, novembre e dicembre sono i tuoi mesi buoni: è lì che si costruisce il cuscinetto per gennaio e agosto, non quando il buco è già arrivato.</div>
  ${rata?`<h3>Il finanziamento</h3>
  <div class="row"><div><div class="t">Rata Consumer Finance</div><div class="m">il ${cf.g} di ogni mese, dallo stesso conto delle tasse</div></div><div class="a">${eur(rata)}</div></div>
  <div class="row"><div><div class="t">In 12 mesi</div><div class="m">quanto toglie al fondo tasse</div></div><div class="a">${eur(rata*12)}</div></div>
  <div class="note" style="margin-top:6px">Senza il contratto non posso dirti se conviene chiuderlo: serve il tasso. Se è a tasso zero si lascia correre; se paga interessi, con ${eur(rata)} al mese liberi si chiude prima qualcos'altro.</div>`:''}
  `, true);
}

async function openPin(who,attivazione){

   <input class="inp" id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" autocomplete="off" style="text-align:center;font-size:22px;letter-spacing:.3em">
   <div id="pinerr" class="hint" style="color:var(--bad);min-height:16px;margin-top:4px"></div>
   <div style="display:flex;gap:8px;margin-top:10px"><button class="btn ghost" id="x">Annulla</button><button class="btn" id="dologin">${nuovo?'Salva ed entra':'Entra'}</button></div></div>`;
  document.body.appendChild(bg);const inp=bg.querySelector('#pin');setTimeout(()=>inp.focus(),50);
  const err=m=>{bg.querySelector('#pinerr').textContent=m;inp.value='';inp.focus()};
  const go=async()=>{
    const v=inp.value.trim();
    if(!online){ if(v===PIN[who]){state.auth=who;state.profile=who;state.sub=null;save();bg.remove();render();toast('Ciao '+NOMI[who])}else err('PIN non corretto'); return }
    if(v.length<4){err('Almeno 4 cifre');return}
    if(!/^[0-9]+$/.test(v)){err('Solo numeri');return}
    const btn=bg.querySelector('#dologin');btn.textContent='…';
    const rimetti=()=>btn.textContent=nuovo?'Salva ed entra':'Entra';
    if(nuovo){
      const {data,error}=await sb.rpc('imposta_pin',{p:who,codice:v,pepe:PEPE});
      if(error){rimetti();err('Errore di collegamento');return}
      if(data!=='ok'){rimetti();err(data==='pin-corto'?'Almeno 4 cifre':data==='pin-cifre'?'Solo numeri':data==='gia-impostato'?'Questo profilo ha già un PIN':'Non riesco: '+data);return}
    }
    const {error:e2}=await sb.auth.signInWithPassword({email:MAIL(who),password:PEPE+v});
    rimetti();
    if(e2){err(/Invalid login/i.test(e2.message)?'PIN non corretto':e2.message);return}
    await dopoLogin();
    state.auth=who;state.profile=who;state.sub=null;state.tab='home';
    bg.remove();render();toast('Ciao '+NOMI[who]);
  };
  bg.querySelector('#dologin').addEventListener('click',go);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});
  bg.addEventListener('click',e=>{if(e.target===bg||e.target.id==='x')bg.remove()});
}

function catMov(cat,ym){

  const cls=LS('bh-impcls')||{}, IMP=LS('bh-imp')||[]; const key=m=>`${m.k}|${m.d}|${m.imp}|${m.desc.slice(0,40)}`;
  vars.forEach(v=>{const mov=[];
    MOV.filter(m=>m.cat===v.v&&m.d.startsWith(ym)&&m.a<0).forEach(m=>mov.push({d:m.d,imp:-m.a,src:m.v}));

  return out;
}

// dove va a finire davvero un movimento: su quale conto, quando, e cosa fa al fido
function destinazione(m,comp,imp,addK){
  const [mezzo,ref]=m.split(':');
  if(mezzo==='contanti')return {testo:`Esce <b>subito</b> dalla cassa contanti di ${ref==='famiglia'?'famiglia':NOMI[ref]||ref}. Non tocca nessun conto e nessun fido.`};
  if(mezzo==='altro'){
    if(addK&&CONTI[addK])return {k:addK,testo:`Pagata con <b>${ref}</b>, addebito sul <b>${CONTI[addK].n}</b>: esce da lì.`,imp};
    return {testo:`Pagata con <b>${ref}</b>. Scegli il conto di addebito qui sopra, così si vede l'effetto sul conto e sul fido.`};
  }
  if(mezzo==='carta'){
    const c=CARTE.find(x=>x.n===ref); if(!c)return {};
    const k=c.conto, C=CONTI[k]||{}, mm=comp||nextComp(c);
    return {k,testo:`Oggi non esce niente dal conto. L'addebito di <b>${ref}</b> arriva sul <b>${C.n||k}</b> il <b>${c.g} ${monthNames[+mm.slice(5)-1]} ${mm.slice(0,4)}</b>, insieme al resto dell'estratto.`,imp};
  }
  const k=ref, C=CONTI[k]||{};
  return {k,testo:`Esce <b>subito</b> dal <b>${C.n||k}</b>${mezzo==='f24'?' come delega F24':''}.`,imp};
}
function effettoTesto(k,imp){
  const E=effettoConto(k,imp); if(!E)return '';
  if(!E.fido)return `Spazio sul ${CONTI[k].n} dopo questa spesa: <b>${eur(E.dopo)}</b> (saldo ${eur(E.saldo)}, nessun fido).`;
  const d=Math.round(E.usoDopo*100), col=E.usoDopo>=.9?'bad':E.usoDopo>=.6?'warn':'good';
  return `Fido ${CONTI[k].n}: da <b>${Math.round(E.usoPrima*100)} %</b> usato oggi a <b style="color:var(--${col})">${d} %</b> una volta usciti carte, fisse e questa spesa. Spazio reale che resta: <b>${eur(E.dopo)}</b>.`;
}

// ricostruisce la stringa 'mezzo:ref' di un movimento salvato, per riselezionarla nel form
function mezzoDaMov(x){
  if(x.mezzo==='carta')return 'carta:'+x.carta;
  if(x.mezzo==='contanti')return 'contanti:'+(x.cassa||'famiglia');
  if(x.mezzo==='altro')return 'altro:'+(x.via||x.conto||'Altro');
  const k=Object.keys(CONTI).find(k=>CONTI[k].n===x.conto)||x.conto;
  return (x.mezzo||'conto')+':'+k;
}
// dato chi paga e la stringa mezzo, trova il bottone in alto e l'eventuale voce del menu a tendina
function segMezzo(chi,m){
  const M=MEZZI[chi]||MEZZI.Comune;
  if(M.some(([v])=>v===m))return {top:m};
  for(const [v] of M){const sub=v.split(':')[1];
    if(sub&&sub.startsWith('*')){const opts=MEZZI_SUB[sub]();if(opts.some(([ov])=>ov===m))return {top:v,sub:m}}}
  return {top:(M[0]||['conto:mpsC'])[0]};
}

  const val=id=>bg.querySelector('#'+id+' .on').dataset.v;
  const drawM=()=>{const w=val('fw');bg.querySelector('#qmw').innerHTML=mezziUI(w);bg.querySelectorAll('#qmz button').forEach(b=>b.addEventListener('click',()=>{bg.querySelectorAll('#qmz button').forEach(x=>x.classList.remove('on'));b.classList.add('on');mezzoSync(bg)}));mezzoSync(bg)};
  const upd=()=>{const n=val('fn'),w=val('fw');bg.querySelector('#ffx').hidden=n!=='fissa';bg.querySelector('#fdx').hidden=n!=='una';bg.querySelector('#fmw').hidden=n!=='una';
    bg.querySelector('#fil').textContent=n==='variabile'?'Budget al mese':'Importo';
    bg.querySelector('#fh').textContent=n==='una'?(w==='Comune'?'Esce dal conto comune, conta nel mese.':`La paga ${w}: conta in famiglia questo mese, come se ${w} avesse messo di più.`):n==='fissa'?`Entra nel fabbisogno ogni mese${w!=='Comune'?', pagata da '+w:''}.`:`Budget mensile nel fabbisogno${w!=='Comune'?', pagato da '+w:''}.`};
  bg.querySelectorAll('#fn button,#fw button').forEach(b=>b.addEventListener('click',()=>{b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(b.parentNode.id==='fw')drawM();upd()}));drawM();upd();
  bg.addEventListener('click',e=>{if(e.target===bg||e.target.id==='x')bg.remove()});
  bg.querySelector('#ff').addEventListener('submit',e=>{e.preventDefault();
    const n=val('fn'),w=val('fw'),v=bg.querySelector('#fv1').value.trim(),cat=bg.querySelector('#fc1').value,imp=+bg.querySelector('#fi1').value||0,m=mezzoVal(bg);
    const conto=w==='Comune'?'mpsC':w==='Franci'?'mpsF':'mpsR';
    if(!imp){toast('Inserisci un importo');return}
    if(n==='una'){const [mz,ref]=m.split(':');const x={d:bg.querySelector('#fd1').value||OGGI,tipo:'spesa',chi:w,per:'famiglia',imp,voce:v,cat,conto:CONTI[conto].n,fam:true,user:true,mezzo:mz};
      if(mz==='carta'){const c=CARTE.find(z=>z.n===ref);if(c){x.carta=c.n;x.comp=nextComp(c);x.conto=CONTI[c.conto].n}}else{x.comp=x.d.slice(0,7);if(CONTI[ref])x.conto=CONTI[ref].n;else if(mz==='altro')x.conto=ref}
      if(mz==='contanti'){const k=ref;CASSE[k]=(CASSE[k]||0)-imp;CASH.push({d:x.d,tipo:'spesa',cassa:k,imp,voce:v,per:'famiglia'});saveCash()}
      LEDGER.push(x);addRow('registro',x)}
    else if(n==='fissa'){const f=bg.querySelector('#ff1').value;const mesi=f==='mensile'?undefined:f==='bimestrale'?[2,4,6,8,10,12]:f==='trimestrale'?[1,4,7,10]:f==='semestrale'?[1,7]:[NEXT.m];
      FISSE.push({id:'x'+Date.now(),v,ente:cat,cat,conto,chi:w,centro:'famiglia',g:+bg.querySelector('#fg1').value||15,f,mesi,imp,custom:true,base:'ultimo'})}
    else VARIABILI.push({v,cat,centro:'famiglia',chi:w,budget:imp,eff:0,custom:true,note:'aggiunta da Famiglia'});
    save();bg.remove();render();toast(`${n==='una'?'Spesa':n==='fissa'?'Fissa':'Variabile'} aggiunta · paga ${w==='Comune'?'la famiglia':w}`)});
}
function openVoce(){
  const bg=document.createElement('div');bg.className='sheet-bg';
  bg.innerHTML=`<div class="sheet"><h2>Spesa ipotizzata per la famiglia</h2><form id="fv">
   <label class="f">Voce</label><input id="nv" placeholder="es. Campo estivo, nuova assicurazione" required>
   <label class="f">Importo</label><input id="ni" type="number" step="0.01" required>
   <label class="f">Frequenza</label><select id="nf"><option value="mensile">mensile</option><option value="trimestrale">trimestrale</option><option value="semestrale">semestrale</option><option value="annuale">annuale</option></select>
   <label class="f">Giorno di addebito</label><input id="ng" type="number" min="1" max="31" value="15">
   <label class="f">Chi paga</label><select id="nc"><option>Comune</option><option>Franci</option><option>Roby</option></select>
   <div style="display:flex;gap:8px;margin-top:16px"><button type="button" class="btn ghost" id="x">Annulla</button><button class="btn">Aggiungi</button></div></form></div>`;
  document.body.appendChild(bg);bg.addEventListener('click',e=>{if(e.target===bg||e.target.id==='x')bg.remove()});
  bg.querySelector('#fv').addEventListener('submit',e=>{e.preventDefault();const chi=$('#nc').value;const f=$('#nf').value;const m=f==='mensile'?undefined:f==='trimestrale'?[1,4,7,10]:f==='semestrale'?[1,7]:[NEXT.m];
    FISSE.push({id:'x'+Date.now(),v:$('#nv').value,ente:'ipotesi',cat:'Ipotesi',conto:chi==='Comune'?'mpsC':chi==='Franci'?'mpsF':'mpsR',chi,centro:'famiglia',g:+$('#ng').value||15,f,mesi:m,imp:+$('#ni').value||0,custom:true});
    save();bg.remove();render();toast('Voce aggiunta alla famiglia')});
}
document.querySelectorAll('#profile button').forEach(b=>b.classList.toggle('on',b.dataset.p===state.profile));
const h=location.hash.replace('#','');if(TABS.includes(h))state.tab=h;
(async()=>{await boot();render()})();
</script>
